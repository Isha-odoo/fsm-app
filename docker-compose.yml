# Local PostgreSQL for development. On first start it runs every file in ./db in name order
# (001_schema.sql, then 002_quotations.sql).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fsm
      POSTGRES_PASSWORD: fsm_dev_password
      POSTGRES_DB: fsm
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - fsm_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
volumes:
  fsm_pgdata:
